name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - main

env:
  VM_IP: ${{ secrets.VM_IP }}
  SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
  SSH_KEY: ${{ secrets.SSH_KEY }}
  PROJECT_DIR: "/home/${{ secrets.SSH_USERNAME }}/client_from_github"
  WORKING_DIR: "client"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.WORKING_DIR }}

      - name: Run lint
        run: npm run lint
        working-directory: ${{ env.WORKING_DIR }}

      - name: Build project
        run: npm run build
        working-directory: ${{ env.WORKING_DIR }}

      - name: Setup SSH
        run: |
          echo "$SSH_KEY" > ssh_key.pem
          chmod 600 ssh_key.pem
          mkdir -p ~/.ssh
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Debug SSH Connection
        run: ssh -v -o StrictHostKeyChecking=no -i ssh_key.pem $SSH_USERNAME@$VM_IP "echo SSH connection successful"

      - name: Deploy to VM using rsync
        run: |
          timeout 60s rsync -avz -e "ssh -o StrictHostKeyChecking=no -i ssh_key.pem" client/ $SSH_USERNAME@$VM_IP:$PROJECT_DIR || echo "Rsync Timed Out"
          ssh -o StrictHostKeyChecking=no -i ssh_key.pem $SSH_USERNAME@$VM_IP << 'EOF'
            # เข้าไปที่โฟลเดอร์โปรเจกต์
            cd $PROJECT_DIR
            npm install
            npm run build
            
            # ย้ายไฟล์ที่ build แล้วไปไว้ที่ /var/www/client
            sudo mkdir -p /var/www/client
            sudo cp -r $PROJECT_DIR/build/* /var/www/client/
            sudo chown -R www-data:www-data /var/www/client

            # ใช้ sudo su - เพื่อรัน pm2 ด้วยสิทธิ์ root
            sudo su - << 'INNER_EOF'
              pm2 restart dtect || pm2 start npm --name "dtect" -- run start
            INNER_EOF
          EOF


      - name: Cleanup
        run: rm -f ssh_key.pem

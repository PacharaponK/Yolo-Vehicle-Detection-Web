name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - main

env:
  VM_IP: ${{ secrets.VM_IP }}
  SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
  SSH_KEY: ${{ secrets.SSH_KEY }}
  PROJECT_DIR: "/home/${{ secrets.SSH_USERNAME }}/client_from_github"
  WORKING_DIR: "client"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.WORKING_DIR }}

      - name: Run lint
        run: npm run lint
        working-directory: ${{ env.WORKING_DIR }}

      - name: Build project
        run: npm run build
        working-directory: ${{ env.WORKING_DIR }}

      - name: Setup SSH
        run: |
          echo "$SSH_KEY" > ssh_key.pem
          chmod 600 ssh_key.pem
          mkdir -p ~/.ssh
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Debug SSH Connection
        run: ssh -v -o StrictHostKeyChecking=no -i ssh_key.pem $SSH_USERNAME@$VM_IP "echo SSH connection successful"

      - name: Deploy to VM using rsync
        run: |
          echo "Checking SSH Connection..."
          ssh -i ssh_key.pem -o StrictHostKeyChecking=no $SSH_USERNAME@$VM_IP "echo 'SSH Connection Successful'" || { echo 'SSH Connection Failed'; exit 1; }

          echo "Restarting VM if required..."
          ssh -i ssh_key.pem -o StrictHostKeyChecking=no $SSH_USERNAME@$VM_IP "if [ -f /var/run/reboot-required ]; then sudo reboot; exit 0; fi"

          echo "Starting Rsync..."
          timeout 600s rsync -avz -vvv --progress --exclude=node_modules -e "ssh -o StrictHostKeyChecking=no -i ssh_key.pem" client/ $SSH_USERNAME@$VM_IP:$PROJECT_DIR || { echo "Rsync Failed"; exit 1; }

          echo "Running Deployment on VM..."
          ssh -tt -o StrictHostKeyChecking=no -i ssh_key.pem $SSH_USERNAME@$VM_IP << 'EOF'
            echo "Connected to VM"

            # ตั้งค่า permission ให้ถูกต้อง
            sudo chown -R $SSH_USERNAME:$SSH_USERNAME $PROJECT_DIR
            cd $PROJECT_DIR

            # อัปเดต npm และจัดการ package-lock.json
            sudo npm install -g npm@latest
            rm -rf node_modules package-lock.json
            npm install

            # Build โปรเจกต์
            npm run build

            # ย้ายไฟล์ที่ build ไปยัง /var/www/client
            sudo mkdir -p /var/www/client
            sudo cp -r $PROJECT_DIR/build/* /var/www/client/
            sudo chown -R www-data:www-data /var/www/client

            # ใช้ sudo su - เพื่อรัน pm2 ด้วยสิทธิ์ root
            sudo su - << 'INNER_EOF'
              pm2 restart dtect || pm2 start npm --name "dtect" -- run start
            INNER_EOF

            echo "Deployment Completed Successfully"
          EOF


      - name: Cleanup
        run: rm -f ssh_key.pem

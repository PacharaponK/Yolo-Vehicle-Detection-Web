name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - main  # Deploy เมื่อ push ไป main branch

env:
  VM_IP: ${{ secrets.VM_IP }}
  SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
  SSH_KEY: ${{ secrets.SSH_KEY }}
  USER: ${{ secrets.USER }}
  PROJECT_DIR: "/home/${{ secrets.SSH_USERNAME }}/my-next-app"
  WORKING_DIR: "client"  # เพิ่มตัวแปรสำหรับ subfolder ที่มี package.json

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout โค้ด
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. ตั้งค่า Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3. ติดตั้ง dependencies (ใน subfolder)
      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.WORKING_DIR }}  # ระบุ subfolder

      # 4. รัน lint เพื่อตรวจสอบโค้ด
      - name: Run lint
        run: npm run lint
        working-directory: ${{ env.WORKING_DIR }}

      # 5. Build โปรเจค Next.js
      - name: Build project
        run: npm run build
        working-directory: ${{ env.WORKING_DIR }}

      # 6. ตั้งค่า SSH key
      - name: Setup SSH
        run: |
          echo "$SSH_KEY" > ssh_key.pem
          chmod 600 ssh_key.pem

      # 7. Deploy ไป Google Cloud VM
      - name: Deploy to VM
        run: |
          # คัดลอกไฟล์จาก subfolder ไปยัง VM
          scp -i ssh_key.pem -r ./${{ env.WORKING_DIR }}/* $SSH_USERNAME@$VM_IP:$PROJECT_DIR
          
          # รันคำสั่งบน VM ด้วย sudo su -
          ssh -i ssh_key.pem $SSH_USERNAME@$VM_IP << 'EOF'
            sudo su - << 'INNER_EOF'
              cd $PROJECT_DIR
              npm install
              npm run build
              pm2 restart dtect || pm2 start npm --name "dtect" -- run start
            INNER_EOF
          EOF

      # 8. ลบ SSH key
      - name: Cleanup
        run: rm -f ssh_key.pem
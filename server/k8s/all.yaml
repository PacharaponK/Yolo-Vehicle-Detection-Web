apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express-app
          image: alivefordie/express-server:2.1
          imagePullPolicy: Always
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1.5Gi"
              cpu: "1.5"
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: express-env
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: express-env
                  key: SECRET_KEY
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: express-config
                  key: PORT
            - name: URL
              valueFrom:
                configMapKeyRef:
                  name: express-config
                  key: URL
            - name: FRONT_URL
              valueFrom:
                configMapKeyRef:
                  name: express-config
                  key: FRONT_URL
            - name: FRONT_PORT
              valueFrom:
                configMapKeyRef:
                  name: express-config
                  key: FRONT_PORT
---
apiVersion: v1
kind: Service
metadata:
  name: express-prisma-service
spec:
  selector:
    app: express-app
  # type: LoadBalancer
  # loadBalancerIP: xxx.xxx.xxx.xxx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: express-config
data:
  PORT: "3001"
  URL: ""
  FRONT_URL: ""
  FRONT_PORT: ""
---
apiVersion: v1
kind: Secret
metadata:
  name:  express-env
type: Opaque
data:
   DATABASE_URL: bXlzcWw6Ly9mb3J0aHJlZTpmb3J0cmVlQDM0LjQ0LjgwLjEzMDozMzA2L3Rlc3Q=
   SECRET_KEY: UExqUzFxcUlpUXNETGpZZFdBWURFRFhRTzFQUzZsMVFJNWFwUExUUWZQNlhxV2JLRUwwU2hlV2FLOTdobjRZNTBXOWVLU0ZFekNGcE9SZHJtM0VTb0E=
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: express-ingress
  annotations:
    kubernetes.io/ingress.global-static-ip-name: gb-express-server
    networking.gke.io/managed-certificates: express-cert
spec:
  # tls:
  # - hosts:
  #   - alivefordie.life
    # Uncomment the next line if you’re using a self-managed TLS certificate secret
    # secretName: tls-secret
  rules:
  - host: alivefordie.life
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: express-prisma-service
            port:
              number: 80
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: express-cert
spec:
  domains:
    - alivefordie.life

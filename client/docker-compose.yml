version: '3'

services:
  nextjs:
    build: .
    container_name: nextjs
    expose:
      - "3000"  # เปิดให้ Nginx เชื่อมต่อ

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443" # เปิดพอร์ต SSL
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt # แชร์โฟลเดอร์ Certbot
      - ./certbot/www:/var/www/certbot
    depends_on:
      - nextjs

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot -d dtect-sda-project.xyz --email ballxlenver7@gmail.com --agree-tos --no-eff-email --force-renewal
